services:
  
  postgres:
    image: postgres:16-alpine
    container_name: marketpulse-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./sql/volatility_view.sql:/docker-entrypoint-initdb.d/02_volatility_view.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    container_name: marketpulse-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  create-topics:
    build: .
    command: python scripts/create_topics.py
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      - kafka
    restart: "no"

  live-producer:
    build: .
    command: python -m src.producer.live_producer
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      create-topics:
        condition: service_completed_successfully

  consumer:
    build: .
    command: python -m src.consumer.trade_consumer
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
      create-topics:
        condition: service_completed_successfully

  api:
    build: .
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DB_HOST: postgres
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: